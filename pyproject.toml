[project]
name = "prussian-embeddings"
version = "0.1.0"
description = "Embeddings for Prussian dictionary: backends, store, and generation CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "httpx>=0.27",
    "prussian-fst",
]

[project.optional-dependencies]
local = ["fastembed>=0.4"]
model2vec = ["model2vec>=0.3.0"]
distill = ["model2vec[distill]", "torch>=2.9.0", "triton-xpu"]
sentence-transformers = ["sentence-transformers>=3", "torch>=2.9.0", "triton-xpu"]
dev = ["pytest>=8"]

[project.scripts]
prussian-embeddings-generate = "prussian_embeddings.generate:main"
prussian-embeddings-eval = "prussian_embeddings.evaluate:main"
prussian-embeddings-build-chunks = "prussian_embeddings.build_chunks:main"
prussian-embeddings-search = "prussian_embeddings.search_cli:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prussian_embeddings"]

# Leichte Gruppe — wird per `uv sync`/`uv run` immer mitinstalliert.
[dependency-groups]
dev = [
    "abydos>=0.5.0",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
]

# Schwere ML-Abhängigkeiten (torch/triton-XPU über model2vec[distill]) bewusst
# NICHT in `dev`: Der Produktions-Server braucht nur den `api`-Backend und soll
# kein torch ziehen. Aktivieren bei Bedarf: `uv sync --group distill`.
distill = [
    "einops>=0.8.2",
    "model2vec[distill]>=0.8.2",
]

[tool.uv]
default-groups = ["dev"]

# torch nur als XPU-Build (Intel-GPU) beziehen, nie die CUDA-Default-Wheels
[tool.uv.sources]
# NVH-Leser (prussian_fst.nvh) editierbar aus dem Geschwister-Checkout.
prussian-fst = { path = "../fst", editable = true }
torch = [{ index = "pytorch-xpu" }]
triton-xpu = [{ index = "pytorch-xpu" }]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
